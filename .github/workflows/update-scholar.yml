name: Update Google Scholar citations

# Daily refresh of assets/data/scholar.json, which publications.html reads on load.
# Two attempts a day: Scholar sometimes answers 403 to a runner, and each run gets a new IP.
on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
    - cron: "17 17 * * *"  # second attempt at 17:17 UTC
  workflow_dispatch:         # manual run from the Actions tab
  push:                      # also run when the updater itself changes
    branches: [master]
    paths:
      - ".github/workflows/update-scholar.yml"
      - "scripts/update_scholar.py"

permissions:
  contents: write   # commit the refreshed JSON
  pages: write      # ask GitHub Pages to rebuild after the commit

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch Google Scholar profile
        run: python scripts/update_scholar.py

      - name: Commit if the data changed
        id: commit
        run: |
          if git diff --quiet -- assets/data/scholar.json; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar.json
          git commit -m "Update Google Scholar citations"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
